<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integração de JavaScript DOM</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <form id="form">
        <input type="number" id="campo-a" placeholder="Campo A" required>
        <input type="number" id="campo-b" placeholder="Campo B" required>
        <p class="error-message">Campo B precisa ser maior que Campo A</p>
        <button id= "enviar" type="submit">Enviar</button>
        <p class="sucess-message"></p>
    </form>

    <script src="main.js"></script>
</body>
</html>
